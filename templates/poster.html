<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Wichtig für die Darstellung auf Smartphones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Das Poster zur Video Collection.">

    <title>Poster</title>

    <!-- Dein bestehendes Stylesheet -->
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="video-page">

    <main>
        <!-- Zurück zur Startseite -->
        <a class="back-link" href="../index.html">
            <span aria-hidden="true">←</span>
            Zurück zur Übersicht
        </a>

        <!-- Überschrift -->
        <header class="video-header">
            <p class="eyebrow">Information</p>
            <h1>Poster</h1>
            <p class="video-description">
                Hier kannst du das Poster ansehen und als PDF öffnen.
            </p>
        </header>

        <!-- PDF-Anzeige -->
        <div class="poster-wrapper">
            <iframe
                src="../poster/poster.pdf"
                title="Poster"
                loading="lazy">
            </iframe>
        </div>

        <!-- Buttons -->
        <div class="video-actions">
            <a
                class="button"
                href="../poster/poster.pdf"
                target="_blank"
                rel="noopener noreferrer">
                PDF öffnen ↗
            </a>
        </div>

        <div class="video-actions">
            <a class="back-link" href="../index.html">
                ← Zurück zur Übersicht
            </a>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
